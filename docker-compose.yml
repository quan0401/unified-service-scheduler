# Full stack: PostgreSQL 16 plus the scheduler API.
#
#   docker compose up --build -d
#   docker compose run --rm api pnpm db:seed
#
# The API applies migrations on start, so the exclusion constraints exist
# before it accepts a request.
#
# Database files live in ./.data/postgres inside the repository rather than in
# a Docker-managed named volume. That makes the state visible and disposable --
# `rm -rf .data` is a full reset -- at the cost of bind-mount I/O, which is
# noticeably slower on macOS and Windows. For a production deployment a named
# volume or managed database would be the right call.
#
# Host ports are deliberately non-default (55432, 13000) so this stack can run
# alongside a local PostgreSQL and a local `pnpm start:dev` without a clash.

services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
      # Bind-mounted host directories are not empty on first use on some
      # platforms; a subdirectory keeps initdb happy.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '55432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scheduler-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler?schema=public&connection_limit=50
      PORT: '3000'
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
      HOLD_TTL_SECONDS: '120'
      DB_LOCK_TIMEOUT_MS: '2000'
      DB_STATEMENT_TIMEOUT_MS: '5000'
      # Raised from the default 20/sec: the concurrency demo drives hundreds of
      # requests from one address, which is indistinguishable from abuse at
      # production thresholds. The guard stays wired, so a misconfiguration
      # still surfaces.
      THROTTLE_BURST_LIMIT: '10000'
      THROTTLE_SUSTAINED_LIMIT: '100000'
      # Empty unless supplied, and empty is falsy, so startTracing() returns
      # immediately and the default stack behaves exactly as it did before
      # Jaeger existed. Set it to switch tracing on -- see the jaeger service.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - '13000:3000'
    restart: unless-stopped

  # Trace backend, off by default.
  #
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 \
  #     docker compose --profile observability up -d --build
  #
  # Then open http://localhost:16686 and search for service `scheduler-api`.
  # A contended booking appears as one `booking.book` span containing several
  # `booking.attempt` children -- a retry storm, visibly a retry storm.
  #
  # Traces live in ./.data/jaeger, alongside the database, so a trace you were
  # reading is still there after a restart. The all-in-one image defaults to
  # ephemeral tmpfs storage, which loses every span when the container stops --
  # unhelpful for a tool whose entire purpose is looking at what happened.
  #
  # Badger keeps 72h by default (--badger.span-store-ttl), so the directory does
  # not grow without bound the way an untended trace store otherwise would.
  #
  # No `depends_on` from the api, because a profiled service cannot be depended
  # on from an unprofiled one -- and it does not need to be, since OTLP export
  # over HTTP tolerates an absent collector.
  #
  # Tearing down needs the profile too. A plain `docker compose down` does not
  # see this service and leaves it running; `--remove-orphans` does not catch it
  # either, since it is declared here rather than orphaned. Use
  # `docker compose --profile observability down`.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: scheduler-jaeger
    profiles: ['observability']
    # The image runs as uid 10001. A bind-mounted directory created by Docker is
    # owned by root, which that user cannot write to on Linux, so the storage
    # paths sit under one mount point the entrypoint can chown-free write into.
    user: '${JAEGER_UID:-10001}:${JAEGER_GID:-10001}'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: 'false'
      BADGER_DIRECTORY_VALUE: /badger/values
      BADGER_DIRECTORY_KEY: /badger/keys
    volumes:
      - ./.data/jaeger:/badger
    ports:
      - '16686:16686' # web UI
      - '4318:4318' # OTLP over HTTP
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:14269/']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Metrics backend, off by default, same profile as jaeger:
  #
  #   docker compose --profile observability up -d --build
  #
  # Then http://localhost:19090 for Prometheus and http://localhost:13001 for
  # Grafana, which comes up with the data source wired and the dashboard loaded.
  #
  # Scrapes api:3000/metrics on the compose network. The API already exports the
  # full prom-client default registry -- GC pauses by kind, V8 heap and heap
  # spaces, RSS, event loop lag percentiles, handles and file descriptors -- plus
  # the six booking metrics defined in metrics.service.ts. None of it was being
  # recorded before this; /metrics was reachable only by curl, so the numbers
  # existed exactly as long as the terminal that fetched them.
  #
  # No `depends_on` on api, for the reason the jaeger block above gives: a
  # profiled service cannot depend on an unprofiled one, and it does not need to
  # -- Prometheus retries a refused scrape and reports the target as down until
  # it succeeds.
  #
  # Tearing down needs the profile: `docker compose --profile observability down`.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: scheduler-prometheus
    profiles: ['observability']
    # Runs as nobody. A bind-mounted directory Docker creates is owned by root,
    # which that user cannot write to on Linux -- the same problem jaeger has.
    user: '${PROMETHEUS_UID:-65534}:${PROMETHEUS_GID:-65534}'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # A week is enough to still have last Tuesday's demo, and one target at
      # 5s is a few hundred series -- megabytes, not gigabytes.
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.data/prometheus:/prometheus
    ports:
      - '19090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: scheduler-grafana
    profiles: ['observability']
    depends_on:
      - prometheus
    # Grafana's image runs as uid 472; same bind-mount ownership problem.
    user: '${GRAFANA_UID:-472}:${GRAFANA_GID:-472}'
    environment:
      # Local only, and a login prompt in front of a dashboard nobody can reach
      # from outside this machine buys nothing but friction.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # Land on the dashboard rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/scheduler.json
    volumes:
      - ./infra/observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./infra/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./.data/grafana:/var/lib/grafana
    ports:
      - '13001:3000'
    restart: unless-stopped
