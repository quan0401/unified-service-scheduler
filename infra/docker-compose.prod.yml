# Production stack for the single-instance deployment. Rendered onto the EC2
# host by infra/user-data.sh, which also writes the .env file this reads.
#
# Differences from the root docker-compose.yml, all deliberate:
#   * Images are pulled from ECR, not built here. A t4g.small has 2 GB of RAM;
#     a pnpm install plus two TypeScript builds on that box is a coin flip.
#     Building on the developer's machine is also an exact architecture match --
#     Apple silicon and Graviton are both arm64, so no emulation is involved.
#   * Only nginx publishes ports. The API and the database are reachable on the
#     compose network and nowhere else.
#   * nginx terminates TLS with a Let's Encrypt IP address certificate. Those
#     are issued only under the six-day "shortlived" profile, so the host runs
#     certbot on a timer and its deploy hook reloads this container.
#   * The database password is generated per deploy rather than being the
#     literal `scheduler`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scheduler
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    container_name: scheduler-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD}@postgres:5432/scheduler?schema=public
      PORT: '3000'
      LOG_LEVEL: info
      # Same-origin through nginx, so no preflight is issued and this is
      # belt-and-braces. Pinned to the public URL rather than '*' so a stray
      # cross-origin caller is refused instead of quietly served.
      CORS_ORIGIN: ${CORS_ORIGIN}
      # nginx proxies /api/ here and strips the prefix, so this service sees
      # /customers while a browser must ask for /api/customers. Swagger UI
      # resolves request URLs against this servers entry; without it the
      # try-it-out button calls /customers and gets the SPA's index.html.
      OPENAPI_SERVER_URL: /api
      HOLD_TTL_SECONDS: '120'
      DB_LOCK_TIMEOUT_MS: '2000'
      DB_STATEMENT_TIMEOUT_MS: '5000'
      # The race demo fires hundreds of concurrent POSTs from one address, so
      # per-IP throttling would trip instantly. Raised for the same reason the
      # local compose file raises it: the guard stays wired, so a
      # misconfiguration still surfaces, but it is not measuring the demo.
      THROTTLE_BURST_LIMIT: '10000'
      THROTTLE_SUSTAINED_LIMIT: '100000'
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    container_name: scheduler-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Certificates live on the host, written by certbot's deploy hook to fixed
      # filenames. Read-only here: nginx consumes them and must never be the
      # thing that can corrupt them.
      - ./certs:/etc/nginx/certs:ro
      # The http-01 challenge webroot. certbot writes the token, nginx serves
      # it. Both the first issuance and every six-day renewal go through here.
      - ./webroot:/var/www/certbot:ro
    restart: unless-stopped
