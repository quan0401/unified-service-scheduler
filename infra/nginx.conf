# The public origin. Three jobs: answer the ACME http-01 challenge, serve the
# built SPA over TLS, and reverse-proxy /api to the NestJS container.
#
# The certificate is issued by certbot on the host -- for the names in
# config.sh's DOMAINS array, or for the Elastic IP itself when that array is
# empty. The deploy hook copies the result to the fixed paths below and reloads
# this container, so nginx never needs to know where /etc/letsencrypt keeps
# things, and the same config serves the self-signed bootstrap certificate
# written before the first issuance.
#
# On the IP path renewal is load-bearing rather than housekeeping: IP
# identifiers are only issued under the "shortlived" profile (160 hours) and
# certbot renews at half of that, roughly every 3.3 days. A domain certificate
# gets the standard 90-day profile.

server {
    listen 80 default_server;
    # `_` plus default_server, deliberately: this instance serves every name that
    # resolves to it from one document root, so there is nothing to select
    # between and no reason to enumerate the domains here. Adding named server
    # blocks only becomes necessary if two domains ever need different content
    # or different certificates -- see myDocs/domain-certificate-migration.md.
    server_name _;

    # Must stay reachable over plain HTTP: http-01 validation fetches this path,
    # and it has to work both for the first issuance and every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS. Without it a browser still tries http:// first and depends on the
    # 301 above, which leaves a plaintext round trip on every cold navigation
    # and lets a stale http:// entry in the omnibox keep resurfacing.
    #
    # max-age is deliberately 300 seconds, not the usual 31536000. This header
    # is the one directive here that cannot be taken back: once a browser has
    # seen it, that browser refuses plaintext HTTP to this host for the full
    # max-age no matter what the server later says, and shortening it only
    # helps clients that come back and see the smaller value. Five minutes
    # keeps the blast radius of a mistake to five minutes. Raise it in stages
    # -- 300, then a day, then a week -- confirming TLS is healthy at each
    # step before the next.
    #
    # No includeSubDomains and no preload, for the same reason: both widen the
    # promise to names that are not being served or tested here yet.
    #
    # `always` so the header is sent on error responses too, not just 2xx/3xx.
    add_header Strict-Transport-Security "max-age=300" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The Prometheus registry is not public. It carries the Node version, the
    # process memory profile, request volume and error rates -- operational
    # detail that no browser needs and that makes a stranger's reconnaissance
    # cheaper. Nothing legitimate arrives here: the scraper sits on the compose
    # network and talks to api:3000/metrics directly, never through this proxy.
    #
    # A regex location rather than `location = /api/metrics`, because an exact
    # match would let /api/metrics/ and /API/metrics straight through. Express
    # routes both to the same handler -- its defaults are non-strict and
    # case-insensitive -- so the block in front has to be at least as
    # permissive as the thing behind it.
    #
    # Placement is for the reader only. nginx tests regex locations before
    # plain-prefix ones, and `location /api/` below is a plain prefix (no `^~`),
    # so this wins wherever it sits in the file.
    #
    # 404 rather than 403: a 403 confirms the endpoint is there.
    location ~* ^/api/metrics/?$ {
        return 404;
    }

    location /api/ {
        # Docker's embedded DNS server. Naming the API in an `upstream` block
        # instead would resolve it once, at nginx startup, with two failure
        # modes: nginx refuses to start at all if the API container is not yet
        # up ("host not found in upstream"), and if the API is later recreated
        # with a new address, nginx proxies to the dead one until it is itself
        # restarted. Resolving through a variable defers the lookup to request
        # time and re-resolves on the TTL below.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api:3000;

        # Because proxy_pass carries a variable, nginx no longer strips the
        # location prefix implicitly -- the trailing-slash trick does not apply.
        # The rewrite does it explicitly: /api/appointments reaches the API as
        # /appointments. The original query string is carried over automatically
        # since the replacement contains no "?".
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_host;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bookings fail fast by design: DB_LOCK_TIMEOUT_MS is 2s and
        # DB_STATEMENT_TIMEOUT_MS is 5s. A proxy timeout below those would
        # convert a clean domain error into an opaque 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # The race demo fires hundreds of concurrent POSTs; buffering their
        # responses buys nothing and adds latency.
        proxy_buffering off;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not inherited. nginx inherits add_header from the enclosing
        # level "if and only if there are no add_header directives defined on
        # the current level" -- so the Cache-Control line immediately above
        # would silently drop the server-level HSTS header for every asset.
        # add_header_inherit would express this properly but arrived in nginx
        # 1.29.3; this image is 1.27.
        add_header Strict-Transport-Security "max-age=300" always;
    }

    # SPA fallback. index.html itself must never be cached, or a deploy leaves
    # browsers pointed at asset hashes that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Repeated for the same inheritance reason as /assets/ above. This is
        # the block that serves index.html, so without this line the header
        # would be absent from the one response every visitor is guaranteed
        # to receive.
        add_header Strict-Transport-Security "max-age=300" always;
    }
}
