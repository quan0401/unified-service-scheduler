# The single origin CloudFront points at. Two jobs: serve the built SPA, and
# strip /api on the way to the NestJS container, which mounts no global prefix.
# This mirrors the dev-server proxy in apps/web/vite.config.ts so the deployed
# app and `pnpm dev` resolve the same URLs.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CloudFront compresses on its own, but the origin fetch is a separate hop
    # and gzip here keeps it cheap.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # Docker's embedded DNS server. Naming the API in an `upstream` block
        # instead would resolve it once, at nginx startup, with two failure
        # modes: nginx refuses to start at all if the API container is not yet
        # up ("host not found in upstream"), and if the API is later recreated
        # with a new address, nginx proxies to the dead one until it is itself
        # restarted. Resolving through a variable defers the lookup to request
        # time and re-resolves on the TTL below.
        #
        # The cost is upstream keepalive, which an `upstream` block would have
        # provided. On a container-local network that is a smaller price than
        # either failure above.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api:3000;

        # Because proxy_pass carries a variable, nginx no longer strips the
        # location prefix implicitly -- the trailing-slash trick does not apply.
        # The rewrite does it explicitly: /api/appointments reaches the API as
        # /appointments. The original query string is carried over automatically
        # since the replacement contains no "?".
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_host;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Bookings fail fast by design: DB_LOCK_TIMEOUT_MS is 2s and
        # DB_STATEMENT_TIMEOUT_MS is 5s. A proxy timeout below those would
        # convert a clean domain error into an opaque 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # The race demo fires hundreds of concurrent POSTs; buffering their
        # responses buys nothing and adds latency.
        proxy_buffering off;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. index.html itself must never be cached, or a deploy leaves
    # browsers pointed at asset hashes that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
