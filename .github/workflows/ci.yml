name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Ephemeral database, created and destroyed with this job. These values
      # define the throwaway account rather than unlocking an existing one --
      # they are configuration, not credentials, and are deliberately literal
      # so a fork can run CI without configuring repository secrets.
      #
      # postgres:16-alpine ships contrib, so the btree_gist extension the
      # exclusion-constraint migration requires is available. Without it those
      # constraints are never created and every concurrency assertion passes
      # vacuously.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          # Named scheduler_test because test/global-setup.ts refuses to run
          # against a URL that does not match /scheduler_test/ -- a guard against
          # pointing the destructive suite at a real database.
          POSTGRES_DB: scheduler_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both point at the same database. test/support/app.ts rebinds
      # DATABASE_URL to TEST_DATABASE_URL before importing AppModule anyway;
      # setting both keeps any direct DATABASE_URL read off a development URL.
      DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/scheduler_test?schema=public
      TEST_DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/scheduler_test?schema=public
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      # Reads the packageManager field in package.json, so the pnpm version
      # here can never drift from the one the lockfile was written with.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client types are a prerequisite for `tsc --noEmit`. Turbo's
      # typecheck task depends only on ^build, which builds contracts, not the
      # generated client -- so generation has to be explicit and come first.
      - name: Generate Prisma client
        run: pnpm --filter @scheduler/api db:generate

      - run: pnpm typecheck

      - run: pnpm build

      - name: Unit tests
        run: pnpm test

      # globalSetup applies both migrations to TEST_DATABASE_URL, so the GiST
      # exclusion constraints exist before anything asserts on them. This step
      # covers test/integration/** and the 200-way race in test/concurrency/**.
      - name: Integration and concurrency tests
        run: pnpm test:integration

  publish:
    name: build and push images
    needs: verify
    # Only from main, and only on a push. A pull request -- including one from a
    # fork -- must never reach this job: it would be a path from an untrusted
    # branch to a role that can write to the registry the production host pulls
    # from. The IAM trust policy pins the same condition independently, so this
    # is a guard, not the guard.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required for the OIDC token exchange. `contents: read` is spelled out
      # because naming any permission drops the rest to none.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # No long-lived access keys anywhere. The role is assumed with a token
      # GitHub mints for this workflow run, scoped by the trust policy to this
      # repository and this branch.
      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # linux/amd64 because the host is t3a.small. Runner and target share an
      # architecture, so nothing is emulated and the build is native on both
      # ends. Changing the instance to Graviton means changing this line and
      # the AMI parameter in infra/config.sh together.
      #
      # Tagged with the commit SHA as well as latest: infra/deploy.sh pins the
      # SHA, so what runs on the host is always traceable to one commit.
      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/scheduler-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/scheduler-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/scheduler-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/scheduler-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Report the deployable tag
        run: |
          echo "### Images published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_TAG=${{ github.sha }} ./infra/deploy.sh" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
